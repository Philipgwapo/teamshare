<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>TeamShare</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f172a;color:#e2e8f0;font-family:system-ui,Segoe UI,Arial,sans-serif;text-align:center}
  .box{padding:32px;max-width:420px}
  h1{margin:0 0 8px;font-size:28px}
  p{color:#94a3b8;line-height:1.5}
  .spin{width:36px;height:36px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;
        margin:20px auto;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;margin-top:12px;padding:12px 22px;background:#38bdf8;color:#0f172a;
        border-radius:10px;text-decoration:none;font-weight:600}
  .off{color:#f87171}
</style>
</head>
<body>
<div class="box">
  <h1>TeamShare</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Opening the file server...</p>
</div>
<script>
const API = 'https://api.github.com/repos/Philipgwapo/teamshare/contents/link.json';
async function getLink() {
  try {
    const r = await fetch(API + '?t=' + Date.now(), {cache: 'no-store', headers: {Accept: 'application/vnd.github.raw+json'}});
    if (r.ok) return await r.json();
  } catch (e) {}
  try {
    const r = await fetch('link.json?t=' + Date.now(), {cache: 'no-store'});
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}
(async () => {
  const d = await getLink();
  const msg = document.getElementById('msg');
  if (d && d.url) {
    msg.innerHTML = 'Redirecting... <br><a class="btn" href="' + d.url + '">Open TeamShare</a>';
    location.replace(d.url);
  } else {
    document.getElementById('spin').style.display = 'none';
    msg.innerHTML = '<span class="off">The server PC is offline or still starting.</span><br>Try again in a minute.<br><a class="btn" href="">Retry</a>';
  }
})();
</script>
</body>
</html>
